# Reviewer/fixer selection remains in the machine's global configuration.
# commands.test takes effect only after this config reaches the trusted default
# branch. It runs a baseline; the Test agent still gathers behavioral evidence.
# Windows test worktrees must live on a local drive (global worktree_roots),
# not a WSL UNC share that can trigger Open File - Security Warning dialogs.
commands:
  test: bash scripts/gate-test.sh

# CI runs on GitHub (see .github/workflows/ci.yml), so a pull request always
# registers a real check: the same six suites, on a Windows runner, with a
# freshly built binary and per-suite isolated preferences. commands.test above
# is the WSL convenience wrapper; both build the binary before the suites run.
# These settings are trusted only from the default branch, so this has to reach
# main and not just a feature branch.
