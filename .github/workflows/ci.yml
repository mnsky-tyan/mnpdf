name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a push and the PR it opens must not double-run the same suites
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The suites are PowerShell and drive the real app: they need a Windows
      # session, a per-suite APPDATA, and a freshly built binary. scripts/
      # gate-test.sh is the WSL convenience wrapper for local runs; this is the
      # same nine suites with no WSL in the way.
      - name: Build and run the nine suites
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-ci.ps1

      # A failure has to leave its evidence behind: test-ci.ps1 deletes a
      # suite's isolated state dir only on success, so on a failure the log that
      # says WHICH case failed is still there - and a cancelled run keeps it for
      # the same reason. Without this step a red check gives a reader nothing to
      # look at (the same asymmetry that once made one local failure unreadable).
      - name: Upload the suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: |
            ${{ runner.temp }}\mnpdf-ci-*\**
          if-no-files-found: ignore
          retention-days: 7
