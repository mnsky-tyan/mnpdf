name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# a push and the PR it opens must not double-run the same suites.
# The head repo has to be part of the key: github.head_ref is only the BRANCH
# name, so a fork PR from a branch called main (GitHub's own default, so the
# common fork flow) would otherwise produce the same group as a push to main
# and cancel-in-progress would silently kill one of the two runs. Qualifying by
# the head repository keeps every case distinct. On push there is no
# pull_request payload, so the fallback is this repository.
concurrency:
  group: ci-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  windows-suite:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # The suites are PowerShell and drive the real app: they need a Windows
      # session, a per-suite APPDATA, and a freshly built binary. scripts/
      # gate-test.sh is the WSL convenience wrapper for local runs; this is the
      # same nine suites with no WSL in the way.
      - name: Build and run the nine suites
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-ci.ps1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      # A failure has to leave its evidence behind: test-ci.ps1 deletes a
      # suite's isolated state dir only on success, so on a failure the log that
      # says WHICH case failed is still there - and a cancelled run keeps it for
      # the same reason. Without this step a red check gives a reader nothing to
      # look at (the same asymmetry that once made one local failure unreadable).
      - name: Upload the suite logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: suite-logs
          path: |
            ${{ runner.temp }}\mnpdf-ci-*\**
          if-no-files-found: ignore
          retention-days: 7

  linux-suite:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # build-linux.sh renders the test document through the vendored PDFium,
      # builds the reader and runs the headless engine suite. The gate then
      # drives the real binary on Xvfb and verifies its pixels and state files.
      - name: Install the Linux runtime and test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libcurl4-openssl-dev \
            xvfb x11-utils python3-pil desktop-file-utils xdotool

      - name: Build and run the engine suite
        run: ./build-linux.sh

      - name: Run the Linux gate
        run: ./scripts/linux-gate.sh
        env:
          MNPDF_KEEP_STATE: "1"

      # The gate removes its scratch tree on success; MNPDF_KEEP_STATE makes
      # it keep the pixel shots, per-app logs and state files of a failing run
      # so this upload can hand them to the reader of a red check - the same
      # failing-run evidence rule the windows-suite job follows above.
      # A green run cleaned up after itself and finds nothing to upload.
      - name: Upload the gate state on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-gate-state
          path: |
            /tmp/mnpdf-linux-gate.*
            /tmp/mnpdf-gate-core.*
          if-no-files-found: ignore
          retention-days: 7
