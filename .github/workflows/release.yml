name: release

# One release, both platforms, built from the tag.
#
# Why the Windows asset is not optional: the Windows app finds updates through
# GitHub's /releases/latest, then downloads
#   releases/download/<tag>/mnpdf-win-x64-<tag>.zip
# by name (src/main.cpp:2572). So a release that carried only a Linux archive
# would tell every Windows copy that a newer version exists and then fail to
# fetch it. Every release therefore publishes the Windows ZIP as well, and the
# version contract is checked against README.txt before anything is uploaded.
on:
  push:
    tags: ['v*']
  # A failed release run must be restartable for the SAME tag: v2.8.0 needed
  # three pushes to go green, and the only recovery was deleting the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to (re)publish, e.g. v2.9.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # The version contract comes first and gates both builds: the tag, the app's
  # kAppVersion and README.txt must agree, or a release is published whose
  # updater asks for a ZIP whose name nobody built.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.check.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}
      - name: The tag, kAppVersion and README.txt must agree
        id: check
        shell: bash
        env:
          DISPATCH_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          tag="${DISPATCH_TAG:-$GITHUB_REF_NAME}"
          # A manual run names the tag directly, so a re-run for a tag that
          # already has a release targets that tag and not the default branch.
          # Both anchored greps live in the one script the Linux gate also
          # runs, so the two consumers cannot disagree about the contract.
          ./scripts/check-release-contract.sh . "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  windows:
    needs: contract
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # build.bat is the same recipe the user runs, and it fails loudly on a
      # missing toolchain, a failed compile or a pdfium.dll that never landed.
      - name: Build (build.bat)
        shell: cmd
        run: build.bat

      # The suites drive the real binary, so a release is only cut from a tree
      # whose behaviour is still tested. Same nine suites as ci.yml.
      - name: Run the nine suites
        shell: cmd
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\test-ci.ps1
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}

      - name: Package the Windows ZIP
        shell: pwsh
        run: ./scripts/make-release-zip.ps1 -OutDir build

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: build/mnpdf-win-x64-*.zip
          if-no-files-found: error

  linux:
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      # GTK3 is the only GUI dependency the port adds; libcurl is what the
      # update check links. PDFium is vendored under third_party/pdfium-linux
      # and linked with an $ORIGIN rpath, so the archive needs no LD_LIBRARY_PATH
      # and no system PDFium.
      - name: Install GTK3 and libcurl
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgtk-3-dev libcurl4-openssl-dev

      # build-linux.sh runs the PDFium probe and the engine suite first, so a
      # release cannot be cut from a tree whose engine regressed.
      - name: Build and test
        run: ./build-linux.sh

      # The gate drives the real binary on a virtual display and asserts on the
      # pixels it paints and the state files it writes - the Linux counterpart
      # of the PowerShell suites above. xwininfo (the window counter) lives in
      # x11-utils on Ubuntu, not x11-apps - the gate refuses to run without it,
      # so the dependency is asserted rather than debugged from zero counts.
      - name: Run the Linux gate
        run: |
          sudo apt-get install -y --no-install-recommends xvfb x11-utils python3-pil desktop-file-utils
          ./scripts/linux-gate.sh

      # The repo's own packager, so the workflow and a local release produce the
      # same archive: the binary, libpdfium.so, README-linux.txt and the
      # licences, named the way the update check looks for.
      - name: Package the Linux tarball
        env:
          TAG: ${{ needs.contract.outputs.tag }}
        run: ./scripts/make-release-tarball.sh "$TAG"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-tar
          path: build-linux/mnpdf-linux-x64-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [contract, windows, linux]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - uses: actions/download-artifact@v4
        with:
          name: windows-zip
          path: dist

      - uses: actions/download-artifact@v4
        with:
          name: linux-tar
          path: dist

      # Both assets are asserted before the release is created: an upload that
      # silently carried one file would leave the Windows updater pointing at a
      # ZIP that does not exist, which is worse than no release at all.
      - name: Assert both platform assets are present
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ needs.contract.outputs.tag }}"
          win="dist/mnpdf-win-x64-${tag}.zip"
          lin="dist/mnpdf-linux-x64-${tag}.tar.gz"
          for f in "$win" "$lin"; do
            [ -s "$f" ] || { echo "::error::missing release asset: $f"; exit 1; }
            echo "asset: $f ($(stat -c%s "$f") bytes)"
          done
          # Non-empty is not intact: a truncated archive would publish and then
          # fail on the user's machine. Listing it costs nothing next to
          # building it.
          unzip -tq "$win" || { echo "::error::the Windows zip is corrupt: $win"; exit 1; }
          tar tzf "$lin" >/dev/null || { echo "::error::the Linux tarball is corrupt: $lin"; exit 1; }

      - name: Create the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="${{ needs.contract.outputs.tag }}"
          # --verify-tag: without it gh silently creates a tag from the default
          # branch's HEAD when the named tag does not exist, which would publish
          # the wrong commit. This workflow is only ever entered with a real tag.
          gh release create --verify-tag "$tag" \
            --title "mnpdf ${tag}" \
            --generate-notes \
            dist/mnpdf-win-x64-${tag}.zip \
            dist/mnpdf-linux-x64-${tag}.tar.gz
