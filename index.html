<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>mnpdf</title>
</head>
<body>
  <div id="titlebar" data-tauri-drag-region><span id="titlebar-name">mnpdf</span></div>
  <div id="dragstrip" data-tauri-drag-region title=""></div>
  <div id="scroller"><div id="pages"></div></div>

  <div id="empty">
    <div class="mark">mnpdf</div>
    <div class="hint">Drop a PDF anywhere &middot; right-click &rarr; Open&hellip; &middot; Ctrl+O</div>
  </div>

  <div id="pill" class="hidden" title="Click to jump to a page (Ctrl+G)"></div>

  <div id="search" class="hidden">
    <input id="search-input" placeholder="Find" spellcheck="false" />
    <span id="search-count"></span>
    <button id="search-prev" title="Previous (Shift+F3)">&#8249;</button>
    <button id="search-next" title="Next (F3)">&#8250;</button>
    <button id="search-close" title="Close (Esc)">&#10005;</button>
  </div>

  <div id="thumbs" class="hidden"></div>
  <div id="pinpop" class="hidden"></div>
  <div id="toast" class="hidden"></div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
