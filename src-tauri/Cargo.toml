[package]
name = "mnpdf"
version = "0.1.0"
description = "Minimal local-only PDF reader / highlighter"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"

# windows: keep browser accelerator keys off so WebView2's Ctrl+/- zoom never
# double-applies with the app's own zoom (pinch itself comes through as
# ctrl+wheel, which the page preventDefaults and handles)
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [] }

[profile.release]
strip = true
lto = true
codegen-units = 1
